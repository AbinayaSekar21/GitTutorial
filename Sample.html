  <h1>GITHUB</h1>

<hr>
<p>The popular platform for version control and collaboration, is owned by Microsoft. It became a subsidiary of Microsoft in 2018. The original founders of GitHub, who created the platform to make Git easier to use, were Tom Preston-Werner, Chris Wanstrath, P. J. Hyett, and Scott Chacon. </p>
